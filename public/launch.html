<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14A7A0">
<title>Qala Saku</title>
<!--
  Start page of the installed app. It is static and kept by the service worker,
  so it paints at once; it then opens Beranda, and the logo stays on screen
  until Beranda is ready instead of a blank white page.
-->
<style>
  html, body { margin: 0; height: 100%; background: #F2EFE9; }
  body { display: grid; place-items: center; }
  svg { width: 112px; height: auto; overflow: visible; }
  .arc { animation: breathe 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .arc.right { animation-delay: .2s; }
  .gem { animation: spin 1.6s cubic-bezier(.65, 0, .35, 1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.94); } }
  @keyframes spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(90deg) scale(1.25); } 100% { transform: rotate(180deg) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .arc, .gem { animation: none; } }
</style>
</head>
<body>
<svg viewBox="0 0 328 179" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qala Saku sedang dibuka">
  <path class="arc" d="M89.5 0C117.938 0 143.276 13.2639 159.67 33.9414L139.102 54.5098C128.244 39.0812 110.3 29 90 29C56.8629 29 30 55.8629 30 89C30 122.137 56.8629 149 90 149C110.043 149 127.789 139.172 138.686 124.073L159.67 145.058C143.276 165.735 117.938 179 89.5 179C40.0705 179 0 138.929 0 89.5C0 40.0705 40.0705 0 89.5 0Z" fill="#14A7A1"/>
  <path class="arc right" d="M238.5 0C287.93 0.000241212 328 40.0707 328 89.5C328 138.929 287.93 179 238.5 179C209.819 179 184.29 165.507 167.911 144.524L189.507 122.927C200.322 138.673 218.455 149 239 149C272.137 149 299 122.137 299 89C299 55.8631 272.137 29.0002 239 29C218.197 29 199.866 39.5875 189.103 55.668L167.911 34.4746C184.29 13.4922 209.819 0 238.5 0Z" fill="#14A7A1"/>
  <g class="gem"><rect x="123.006" y="89.7026" width="56.9338" height="56.9338" transform="rotate(-46 123.006 89.7026)" fill="#F9A720"/></g>
</svg>
<script>
  // Let the logo paint first, then open Beranda (sign-in when signed out).
  requestAnimationFrame(function () { setTimeout(function () { location.replace('/dashboard'); }, 0); });
</script>
</body>
</html>
